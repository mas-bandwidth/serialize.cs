name: nightly conformance

# A functional test, nightly, on our own fleet: this port held to the CURRENT
# C/C++ data in mas-bandwidth/serialize, not only to the copy vendored here.
#
# CI on push proves the port against its vendored conformance/ and
# conformance-controls/ (embedded in the test assembly), and the cpp-interop
# job holds the wire to the pinned release. Nothing there runs the port
# against upstream main once it moves on: a vector added, a control's
# .expected list changed, the standard revised. This job does. It checks out
# mas-bandwidth/serialize at main HEAD, builds the C++ reference and runs its
# own ctest (its conformance runner and negative controls, proving the corpus
# at HEAD is what C/C++ accepts today), then runs this port's conformance
# runner and rule controls against THAT corpus (SERIALIZE_CONFORMANCE_DIR and
# SERIALIZE_CONFORMANCE_CONTROLS_DIR, tests/Conformance.cs), and finally
# diffs the vendored copies against upstream. Drift fails: a port behind the
# standard is what this job exists to catch.
#
# Upstream has no corpus generator (conformance.cpp: the corpus is
# deliberately not generated from that code), so the committed corpus at main
# HEAD is the C/C++ data.
#
# No push or pull_request trigger: this never runs in the one-minute CI path.

on:
  schedule:
    - cron: '17 5 * * *'   # every day at 05:17 UTC
  workflow_dispatch:
    inputs:
      sabotage:
        description: 'Negative control: flip one byte of one vector in the upstream copy, so the port must go red'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: port vs mas-bandwidth/serialize main, on the fleet
    runs-on: [self-hosted, Linux, X64, nightly]
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Runner
        run: |
          echo "runner: $RUNNER_NAME"

      - uses: actions/checkout@v7

      - name: Check out mas-bandwidth/serialize at main HEAD
        uses: actions/checkout@v7
        with:
          repository: mas-bandwidth/serialize
          ref: main
          path: upstream

      - name: Record the upstream commit
        run: |
          echo "upstream: mas-bandwidth/serialize@$(git -C upstream rev-parse HEAD) (committed corpus, no generator upstream)"

      # The reference's own build and ctest: its conformance runner over the
      # corpus and its negative controls, so the data this port is held to is
      # data the C/C++ reference accepts at the same commit.
      - name: Build the C++ reference and run its ctest
        working-directory: upstream
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      # a fleet runner must not write /usr/share/dotnet or a shared home: the
      # SDK, the CLI home and the NuGet cache all go in the runner's own
      # persistent tool cache, so no machine global state changes
      - name: A writable .NET CLI home and NuGet cache in the tool cache
        run: |
          echo "DOTNET_CLI_HOME=$RUNNER_TOOL_CACHE/dotnet-home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TOOL_CACHE/nuget-packages" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ format('{0}/dotnet', runner.tool_cache) }}
        with:
          dotnet-version: 10.0.x

      # The negative control for this job: a dispatch with sabotage set turns
      # bits-1-one's stream byte 01 into 00 in the workspace copy of upstream
      # (never committed anywhere), so the port decodes 0 where the corpus
      # states 1 and the conformance step below must go red.
      - name: Sabotage one upstream vector (negative control only)
        if: ${{ inputs.sabotage }}
        run: |
          sed -i '/^name bits-1-one$/,/^bytes/ s/^bytes 01$/bytes 00/' upstream/conformance/bits.txt
          grep -A 2 '^name bits-1-one$' upstream/conformance/bits.txt | grep -qx 'bytes 00'
          echo "sabotaged: conformance/bits.txt bits-1-one bytes 01 -> 00"

      # the shipping Release build: test_conformance_vectors and
      # test_conformance_unknown_operation read the upstream directories
      # instead of the embedded vendored copies
      - name: Port conformance against upstream (Release)
        env:
          SERIALIZE_CONFORMANCE_DIR: ${{ github.workspace }}/upstream/conformance
          SERIALIZE_CONFORMANCE_CONTROLS_DIR: ${{ github.workspace }}/upstream/conformance-controls
        run: dotnet run -c Release --project tests/Tests.csproj -f net10.0 -- conformance

      # the rule controls (SerializeConformanceControls=true, as in ci.yml):
      # each rule deleted must fail EXACTLY its upstream .expected vectors,
      # through the stream and through the batch, on the upstream corpus
      - name: Port rule controls against upstream
        if: ${{ !cancelled() }}
        env:
          SERIALIZE_CONFORMANCE_DIR: ${{ github.workspace }}/upstream/conformance
          SERIALIZE_CONFORMANCE_CONTROLS_DIR: ${{ github.workspace }}/upstream/conformance-controls
        run: dotnet run -c Release --project tests/Tests.csproj -f net10.0 -p:SerializeConformanceControls=true -- conformance

      - name: Vendored STANDARD.md, conformance/ and conformance-controls/ match upstream
        if: ${{ !cancelled() }}
        run: |
          diff -u upstream/STANDARD.md STANDARD.md
          diff -ru upstream/conformance conformance
          diff -ru upstream/conformance-controls conformance-controls
