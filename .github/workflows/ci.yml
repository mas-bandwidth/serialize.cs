name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is Unity's authoring platform: the library is CONSUMED
        # there more than anywhere else, so it compiles and tests there too.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # 10.0.x is the current SDK (builds everything); 8.0.x supplies the LTS
          # runtime so the net8.0 leg runs on the real .NET 8, not a roll-forward
          dotnet-version: |
            8.0.x
            10.0.x
      # the LIBRARY targets three TFMs (net8.0, net10.0, netstandard2.1); this
      # step builds the TEST project, which targets the two runnable ones. The
      # netstandard2.1 leg is built in the next step and exercised via tests-ns21.
      - name: Build tests (net8.0 + net10.0 of the library's three TFMs, warnings are errors)
        run: dotnet build tests/Tests.csproj -c Release
      - name: Build (netstandard2.1, the Unity-class target, C# 9 pinned)
        run: dotnet build src/Serialize.csproj -c Release -f netstandard2.1
      - name: Tests (net10.0)
        run: dotnet run -c Release --project tests/Tests.csproj -f net10.0 --no-build
      - name: Tests (net8.0, the LTS leg)
        run: dotnet run -c Release --project tests/Tests.csproj -f net8.0 --no-build
      # THE UNITY-CLASS GATE: the full suite — the 128 bit surface included, it
      # runs on the emulated pair on every TFM — against the netstandard2.1
      # build of the library, the exact assembly surface a Unity project
      # consumes. The golden wire test inside proves the 2.1 compat shims
      # byte-neutral. Only the two System.Int128 ORACLE tests are absent here:
      # they check the pair against the framework type, which 2.1 lacks.
      - name: Tests (netstandard2.1 assembly, the Unity-class leg)
        run: dotnet run -c Release --project tests-ns21/TestsNs21.csproj
      # no test framework, so the runner's exit code is the whole verdict; this
      # keeps the compat executable compiling everywhere (it is exercised for
      # real in the cpp-interop job; the red team harness runs in its own job)
      - name: Build the compat harness
        run: dotnet build compat/Compat.csproj -c Release

  # THE DEBUG LEG: the write-side contracts AND the API misuse checks are
  # Debug.Assert, compiled out of Release builds — so the Release-only job above
  # can never execute test_write_contract_asserts or test_api_misuse_asserts
  # (they exist only under DEBUG: 54 tests in Debug vs 53 in Release, whose
  # extra test proves the misuse checks ABSENT from the release binary). This
  # job is the only place the assert-execution tests run in CI. Same matrix, TFMs and dotnet setup as the Release job; tests only — the
  # compat harness and the standalone netstandard2.1 compile gate are
  # Release-job concerns (the Unity-class run below still builds the Debug
  # netstandard2.1 library via its project reference).
  test-debug:
    name: test debug (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build tests (Debug, warnings are errors)
        run: dotnet build tests/Tests.csproj -c Debug
      - name: Tests (net10.0, Debug)
        run: dotnet run -c Debug --project tests/Tests.csproj -f net10.0 --no-build
      - name: Tests (net8.0, Debug)
        run: dotnet run -c Debug --project tests/Tests.csproj -f net8.0 --no-build
      # the Unity-class leg in Debug: Unity's editor is exactly where consumers
      # run Debug-class builds, so the contract asserts are proven against the
      # netstandard2.1 assembly surface too (52 tests: the two System.Int128
      # oracle tests need a TFM that 2.1 lacks)
      - name: Tests (netstandard2.1 assembly, Debug)
        run: dotnet run -c Debug --project tests-ns21/TestsNs21.csproj

  redteam:
    name: red team (hostile-input harness)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # the harness records findings instead of stopping at the first one, then
      # exits nonzero if any were recorded: the exit code is the verdict. It used
      # to be build-only here, which meant nobody was reading the answers it was
      # written to produce.
      - name: Run the red team harness (exit code is the verdict)
        run: dotnet run -c Release --project redteam/RedTeam.csproj

  lint:
    name: analyzers and style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # style (IDExxxx) and analyzer (CAxxxx) rules at warning severity, per
      # project, --verify-no-changes so drift fails instead of being fixed
      # silently. Deliberately NOT `dotnet format whitespace`: the repo indents
      # block-namespace bodies flush left, the C++ single-header convention the
      # whole family shares, and the whitespace formatter cannot be taught that.
      # Deliberately NOT AnalysisMode=Recommended either: its naming rules
      # (CA1711/CA1716/CA1051) would demand renaming WriteStream, Error and the
      # 128 bit pair's fields — the API surface the family shares by design.
      - name: dotnet format style + analyzers (verify, all projects)
        run: |
          for p in src/Serialize.csproj tests/Tests.csproj tests-ns21/TestsNs21.csproj compat/Compat.csproj redteam/RedTeam.csproj; do
            echo "== $p"
            dotnet format style "$p" --verify-no-changes --severity warn
            dotnet format analyzers "$p" --verify-no-changes --severity warn
          done

  cpp-interop:
    name: C++ wire compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check out the C++ serialize library (pinned release)
        uses: actions/checkout@v7
        with:
          # v1.7.0 is the family's interop pin: ONE POLICY, ONE VERSION. Every
          # port's gate checks out the same current C++ release, so "compatible
          # with C++" means the same thing in every repo -- under the four
          # different pins this replaces (v1.6.2 here and in Go, v1.4.3 in Rust,
          # upstream HEAD in C), each port certified against a different wire.
          # v1.7.0 is also the release that pins the compressed_float write
          # arithmetic to float32 with two roundings on every architecture --
          # the arithmetic QuantizeCompressedFloat mirrors -- so the
          # byte-identity cmp below is the cross-language proof of that pin.
          # Bump family-wide, deliberately, in its own commit per repo.
          repository: mas-bandwidth/serialize
          ref: v1.7.0
          path: cpp-serialize
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # CXX=clang++ pins the compiler ubuntu's `c++` alias would otherwise leave
      # to g++. -ffp-contract=off inside the script is MANDATORY: strict IEEE
      # evaluation is the normative wire, and the compat sequence carries a value
      # (0.005f in [0,10] res 0.01) sitting exactly on an FMA rounding boundary,
      # so a contracted C++ build fails the byte-identity cmp instead of passing
      # silently. Both sides write, the files must be byte identical, and each
      # side reads the other's.
      - name: Interop gate (byte identity + cross reads, both directions)
        run: CXX=clang++ scripts/interop.sh cpp-serialize

  spec-sync:
    name: STANDARD.md matches upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # STANDARD.md here is a VERBATIM VENDORED COPY of the wire-format
      # specification that lives in mas-bandwidth/serialize. This job fails if the
      # two have diverged.
      #
      # Why vendor rather than link: an implementer wants the normative text
      # beside the implementation, at the revision they are reading. Why check:
      # a duplicated normative document is the same failure as a duplicated
      # constant, except it drifts silently and the ports are what break.
      #
      # Diffed against upstream main, not the interop tag: drift detection is the
      # point, so the newest spec text is what this must catch up to. If this
      # fails, the upstream spec changed. Read the diff, port whatever it
      # implies, then copy the new file across in the same commit.
      - name: Compare against mas-bandwidth/serialize
        run: |
          curl -fsSL -o /tmp/upstream-STANDARD.md \
            https://raw.githubusercontent.com/mas-bandwidth/serialize/main/STANDARD.md
          echo "upstream: mas-bandwidth/serialize@$(git ls-remote https://github.com/mas-bandwidth/serialize.git refs/heads/main | cut -f1)"
          if ! diff -u /tmp/upstream-STANDARD.md STANDARD.md; then
            echo "::error::STANDARD.md has diverged from mas-bandwidth/serialize"
            exit 1
          fi
          echo "STANDARD.md matches upstream"
